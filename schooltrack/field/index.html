<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Arogya SchoolTrack</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F3F6F4; --sheet:#FFFFFF; --ink:#12302E; --ink2:#55706C; --rule:#C9D8D4; --rule2:#E4EDEA;
  --band:#0D5C56; --band-ink:#FFFFFF; --accent:#0E7C6B; --accent-ink:#FFFFFF; --link:#0B6078; --focus:#E0A100;
  --ok:#1B7A47; --ok-bg:#E1F2E8; --bad:#C4352B; --bad-bg:#FBE9E7; --wait:#8A5A05; --wait-bg:#FBF0D6; --warn:#D99A00; --mute:#A3B5B1;
  --series:#0E9C86; --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4;
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0F1B1A; --sheet:#162624; --ink:#E9F3F1; --ink2:#9DB5B0; --rule:#2C4340; --rule2:#20322F;
    --band:#0A3F3B; --band-ink:#FFFFFF; --accent:#4FD1B5; --accent-ink:#06221E; --link:#8FD3E8; --focus:#F1C56C;
    --ok:#86D9A9; --ok-bg:#1C3A2C; --bad:#FF9384; --bad-bg:#40221F; --wait:#F1C56C; --wait-bg:#3A3018; --warn:#F1C56C; --mute:#5F7572;
    --series:#35B8A0; --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181;
  }
}
:root[data-theme="dark"]{
  --paper:#0F1B1A; --sheet:#162624; --ink:#E9F3F1; --ink2:#9DB5B0; --rule:#2C4340; --rule2:#20322F;
  --band:#0A3F3B; --band-ink:#FFFFFF; --accent:#4FD1B5; --accent-ink:#06221E; --link:#8FD3E8; --focus:#F1C56C;
  --ok:#86D9A9; --ok-bg:#1C3A2C; --bad:#FF9384; --bad-bg:#40221F; --wait:#F1C56C; --wait-bg:#3A3018; --warn:#F1C56C; --mute:#5F7572;
  --series:#35B8A0; --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181;
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
h1,h2,h3{font-family:var(--display);font-weight:700;line-height:1.15;margin:0}
h1{font-size:1.6rem} h2{font-size:1.15rem} h3{font-size:1.02rem}
p{margin:0} a{color:var(--link)}
button,select,input,textarea{font:inherit;color:inherit}
textarea{resize:vertical}
:focus-visible{outline:3px solid var(--focus,var(--accent));outline-offset:2px}
.muted{color:var(--ink2)} .small{font-size:.875rem} .num{font-variant-numeric:tabular-nums}
.row{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center}
.between{justify-content:space-between}
.stack>*+*{margin-top:1rem}
.tight>*+*{margin-top:.5rem}

.band{background:var(--band);color:var(--band-ink)}
.band .in{max-width:1180px;margin:0 auto;display:flex;flex-wrap:wrap;gap:.5rem 1.25rem;align-items:center;justify-content:space-between;padding:.75rem 1rem}
.brand{font-family:var(--display);font-weight:700;font-size:1.2rem;line-height:1.15}
.brand small{display:block;font-family:var(--body);font-weight:400;font-size:.8125rem;opacity:.85}
.band a,.band .linkbtn{color:var(--band-ink)}
.linkbtn{background:none;border:0;padding:.4rem .2rem;min-height:44px;text-decoration:underline;cursor:pointer;color:var(--link)}

.seg{display:inline-flex;flex-wrap:wrap;border:1.5px solid var(--ink);border-radius:12px;overflow:hidden;background:var(--sheet)}
.seg button{border:0;background:transparent;padding:.45rem .8rem;min-height:44px;cursor:pointer;flex:1 1 auto}
.seg button+button{border-left:1px solid var(--rule)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper);font-weight:700}
.seg.full{display:flex}

.btn{border:1.5px solid var(--ink);background:var(--sheet);border-radius:12px;padding:.6rem 1rem;min-height:48px;cursor:pointer;font-weight:700;text-decoration:none;color:var(--ink);display:inline-flex;align-items:center;justify-content:center;text-align:center}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.wa{background:#128C4B;border-color:#128C4B;color:#fff}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn.quiet{border-color:var(--rule);font-weight:400}
.btn.sm{min-height:40px;padding:.35rem .75rem;font-size:.9rem}
.btn.block{display:flex;width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}

.pill{display:inline-block;border-radius:999px;padding:.1rem .65rem;font-size:.8125rem;font-weight:700;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.wait{background:var(--wait-bg);color:var(--wait)}
.pill.bad{background:var(--bad-bg);color:var(--bad)} .pill.plain{background:var(--rule2);color:var(--ink2)}
.note{border-left:4px solid var(--ink2);padding:.4rem .75rem;border-radius:0}
.note.bad{border-color:var(--bad);color:var(--bad)} .note.ok{border-color:var(--ok);color:var(--ok)}
.alert{border:2px solid var(--bad);background:var(--bad-bg);color:var(--bad);border-radius:12px;padding:.9rem 1rem}
.alert h2,.alert h3{color:var(--bad)}
.alert .field input{border-color:var(--bad)}
.goodbox{border:2px solid var(--ok);background:var(--ok-bg);color:var(--ok);border-radius:12px;padding:.9rem 1rem}

.phone{max-width:520px;margin:0 auto;padding:1rem 1rem 6.5rem}
.sheet{background:var(--sheet);border:1.5px solid var(--rule);border-radius:14px;padding:1rem}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--sheet);border-top:2px solid var(--ink);padding-bottom:env(safe-area-inset-bottom,0px);z-index:20}
.nav div{max-width:520px;margin:0 auto;display:flex}
.nav button{flex:1;border:0;background:transparent;min-height:58px;padding:.4rem .2rem;cursor:pointer;font-size:.875rem;border-top:4px solid transparent;margin-top:-2px}
.nav button[aria-pressed="true"]{border-color:var(--accent);font-weight:700}
.login{max-width:420px;margin:0 auto;padding:2rem 1rem 3rem}
.field label,.flabel{display:block;font-weight:700;margin-bottom:.25rem}
.field input,.field select,.field textarea{width:100%;min-height:48px;border:1.5px solid var(--ink);border-radius:12px;padding:.5rem .75rem;background:var(--sheet)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}
.check{display:flex;gap:.7rem;align-items:flex-start;padding:.3rem 0}
.check input{width:24px;height:24px;flex:none;margin-top:.1rem}
.thumb{width:120px;max-width:100%;border-radius:10px;border:1.5px solid var(--rule);display:block}
.face{width:56px;height:56px;border-radius:10px;object-fit:cover;border:1.5px solid var(--rule);flex:none;background:var(--rule2)}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.vrow{display:flex;gap:.75rem;align-items:center;padding:.65rem 0;border-bottom:1px solid var(--rule2)}
.vrow:last-child{border-bottom:0}
.vrow .grow{flex:1;min-width:0}
.beads{display:grid;grid-template-columns:repeat(var(--n,8),minmax(0,1fr));gap:4px}
@media(max-width:620px){.beads{grid-template-columns:repeat(4,minmax(0,1fr));row-gap:.6rem}}
.beads div{text-align:center;font-size:.6875rem;color:var(--ink2);line-height:1.2}
.beads i{display:block;height:10px;border-radius:5px;background:var(--rule);margin-bottom:.25rem}
.beads .on i{background:var(--ok)} .beads .on{color:var(--ink)}
.count4{display:grid;grid-template-columns:repeat(4,1fr);border-top:2px solid var(--ink);border-bottom:1px solid var(--rule)}
.count4 div{padding:.5rem .25rem .6rem 0}
.count4 b{display:block;font-family:var(--display);font-size:1.5rem;line-height:1.1}
.count4 span{font-size:.8125rem;color:var(--ink2)}
.steps{display:flex;gap:6px;margin:.4rem 0 1rem}
.steps i{flex:1;height:6px;border-radius:3px;background:var(--rule)} .steps i.on{background:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:.5rem}
.chip{min-width:48px;min-height:48px;border-radius:12px;border:1.5px solid var(--ink);background:var(--sheet);cursor:pointer;font-weight:700;padding:0 .8rem}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.chip:disabled{border-color:var(--rule);color:var(--ink2);cursor:not-allowed;text-decoration:line-through}
.pass{text-align:center}
.pass svg{width:min(260px,70vw);height:auto;background:#fff;border-radius:12px;padding:10px;border:1.5px solid var(--rule)}
.pass .vid{font-family:var(--display);font-size:2rem;font-weight:700;letter-spacing:.04em}
#scan{position:fixed;inset:0;background:#000;z-index:50;display:flex;flex-direction:column}
#scan video{flex:1;min-height:0;width:100%;object-fit:cover}
#scan .sbar{padding:1rem;padding-bottom:calc(1rem + env(safe-area-inset-bottom,0px));background:#000;color:#fff;display:flex;gap:1rem;align-items:center;justify-content:space-between}

.dash{max-width:1180px;margin:0 auto;padding:1rem 1rem 4rem}
.tabs{display:flex;gap:.25rem;overflow-x:auto;border-bottom:1.5px solid var(--rule);margin-bottom:1.25rem}
.tabs button{border:0;background:transparent;padding:.7rem 1rem;min-height:44px;cursor:pointer;white-space:nowrap;border-bottom:4px solid transparent;margin-bottom:-1.5px;color:var(--ink2)}
.tabs button[aria-selected="true"]{border-color:var(--tc,var(--accent));color:var(--ink);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:1rem}
.tile{background:var(--sheet);border:1.5px solid var(--rule);border-radius:14px;padding:1rem 1.1rem 1.1rem;grid-column:span 12;min-width:0}
.tile>.thead{display:flex;gap:.75rem;justify-content:space-between;align-items:flex-start;margin-bottom:.15rem}
.tile .sub{color:var(--ink2);font-size:.875rem;margin-bottom:.8rem}
.tile .tools{display:flex;gap:.35rem;flex:none}
.span12{grid-column:span 12}
@media (min-width:860px){.s3{grid-column:span 3}.s4{grid-column:span 4}.s5{grid-column:span 5}.s6{grid-column:span 6}.s7{grid-column:span 7}.s8{grid-column:span 8}}
@media (min-width:560px) and (max-width:859px){.s3,.s4{grid-column:span 6}}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));grid-column:span 12;border-top:2px solid var(--ink);border-bottom:1px solid var(--rule)}
.kpis div{padding:.8rem 1rem .9rem 0}
.kpis b{display:block;font-family:var(--display);font-size:1.9rem;line-height:1.1}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:.5rem .6rem;border-bottom:1px solid var(--rule2);vertical-align:middle}
th{color:var(--ink2);font-size:.875rem} td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.qcard{background:var(--sheet);border:1.5px solid var(--rule);border-left:5px solid var(--wait);border-radius:0;padding:1rem}
.qcard.red{border-left-color:var(--bad)}
.flag{color:var(--bad);font-weight:700}
svg.chart{display:block;height:auto;max-width:100%}
#tip{position:fixed;z-index:80;pointer-events:none;background:var(--ink);color:var(--paper);padding:.3rem .55rem;border-radius:6px;font-size:.8125rem;max-width:260px;line-height:1.3}
dialog{border:2px solid var(--ink);border-radius:14px;background:var(--sheet);color:var(--ink);padding:0;width:min(600px,calc(100% - 1.5rem));max-height:calc(100% - 1.5rem)}
dialog::backdrop{background:rgba(15,15,30,.6)}
dl{display:grid;grid-template-columns:auto 1fr;gap:.3rem 1rem;margin:0}
dt{color:var(--ink2)} dd{margin:0}
details summary{cursor:pointer;font-weight:700;min-height:44px;display:flex;align-items:center}
.cellin{min-height:44px;border:1.5px solid var(--ink);border-radius:10px;padding:.4rem .6rem;background:var(--sheet);color:var(--ink);font:inherit;width:100%}

.acts{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin-top:.6rem}
.acts span{display:block;text-align:center;border-radius:6px;padding:.25rem 0;font-size:.8125rem;font-weight:700;font-variant-numeric:tabular-nums;border:1.5px solid var(--rule);color:var(--ink2)}
.acts .counted{background:var(--ok);border-color:var(--ok);color:var(--sheet)}
.acts .pending,.acts .flagged{background:var(--wait-bg);border-color:var(--wait);color:var(--wait)}
.reg{background:var(--sheet);border:1.5px solid var(--rule);min-width:720px}
.reg th,.reg td{border-bottom:1px solid var(--rule);border-right:1px solid var(--rule2);text-align:center;padding:0}
.reg th{padding:.45rem .3rem}
.reg .cls{text-align:left;padding:.4rem .7rem;white-space:nowrap}
.reg .sch td{text-align:left;padding:.55rem .7rem;background:var(--paper);font-family:var(--display);font-weight:700}
.reg .sch span{font-family:var(--body);font-weight:400;color:var(--ink2);font-size:.875rem;margin-left:.5rem}
.cell{width:100%;min-width:44px;height:44px;border:0;background:transparent;cursor:pointer;font-size:1.2rem;font-weight:700;line-height:1}
.cell.counted{color:var(--ok)} .cell.pending{color:var(--wait)} .cell.flagged{color:var(--bad);background:var(--bad-bg)} .cell.rejected{color:var(--mute)}
.cell.none{cursor:default}
.crit{display:grid;grid-template-columns:auto 1fr auto;gap:.3rem .75rem;align-items:center;padding:.4rem 0;border-bottom:1px solid var(--rule2)}
.crit input{width:22px;height:22px}
.meter{height:10px;background:var(--rule2);border-radius:5px;overflow:hidden;min-width:120px}
.meter i{display:block;height:100%;background:var(--ok)}
.tally{display:grid;grid-template-columns:repeat(3,1fr);border-top:2px solid var(--ink);border-bottom:1px solid var(--rule)}
.tally div{padding:.5rem .25rem .6rem 0}
.tally b{display:block;font-family:var(--display);font-size:1.5rem;line-height:1.1}
.tally span{font-size:.8125rem;color:var(--ink2)}
</style>
</head>
<body>
<div class="band"><div class="in">
  <div class="brand">Arogya SchoolTrack<small id="rolelab">Healthy Schools Program</small></div>
  <div class="row" id="bandlinks"></div>
</div></div>
<main id="app"></main>
<dialog id="dlg" aria-label="Details"></dialog>

<script src="../../lib/awit.js"></script>
<script>
"use strict";
const {esc,nf,pct,sum,fmtDay,fmtTime,fmtDist,dayKey,uid,rng,hav,ch,tile,kpis}=AWIT;
const ROLE="field",KEY="schooltrack.v2",MEKEY="schooltrack.me",GEOFENCE_M=150,MIN_MIN=30,GAP_DAYS=15,DUP_BITS=4;
const ORGS={aw:"Arogya World India Trust",cini:"CINI",mamta:"MAMTA"},ORGSHORT={aw:"Arogya World",cini:"CINI",mamta:"MAMTA"};
const REASONS=["School closed or holiday","Exams or a school event","Teacher or class not available","I could not travel","Other"];
const STATUS={counted:{sym:"✓",label:"Counted",cls:"ok"},pending:{sym:"•",label:"Waiting for review",cls:"wait"},flagged:{sym:"!",label:"Flagged to partner",cls:"bad"},rejected:{sym:"✕",label:"Not counted",cls:"plain"}};
const $=s=>document.querySelector(s);

const blank=()=>({coords:[],schools:{},sessions:{},misses:{},flags:{},as:{}});
let S=blank();
function loadS(){const p=AWIT.get(KEY);if(p&&p.schools&&p.sessions){S=Object.assign(blank(),p);return true}return false}
loadS();
let saveWarn="",unlocked=false;
function save(){saveWarn=AWIT.set(KEY,S)?"":"This device could not save the change. It stays until you close this page."}
const ui={tab:"schools",dtab:"overview",me:null,org:null,pf:"all",loc:"real",screen:"home",schoolId:null,draft:null,miss:null,lastId:null,asOpen:null,who:"",pin:"",msg:"",ok:""};
try{ui.me=localStorage.getItem(MEKEY)}catch(e){}
const me=()=>S.coords.find(c=>c.id===ui.me)||null;
const coordName=id=>(S.coords.find(c=>c.id===id)||{}).name||"Unassigned";
const pill=st=>'<span class="pill '+STATUS[st].cls+'">'+STATUS[st].label+"</span>";

/* ---------- rules ---------- */
function findDup(hash,selfId){if(!hash)return null;let best=null;
  for(const s of Object.values(S.sessions)){if(s.id===selfId)continue;for(const p of s.photos){if(p.kind!=="class"||!p.hash)continue;const d=AWIT.ham(hash,p.hash);if(d<=DUP_BITS&&(!best||d<best.dist))best={sid:s.id,dist:d}}}return best}
function evaluate(s){
  const sc=S.schools[s.schoolId],cl=sc&&sc.classes.find(c=>c.id===s.classId),f=[];
  if(s.sim)f.push("Demo mode: the location and the session length were simulated.");
  if(s.newAnchor)f.push("First visit: the school's location was set from this check-in.");
  else if(s.noGps)f.push("The phone did not give a location.");
  else{if(s.distIn>GEOFENCE_M)f.push("Checked in "+fmtDist(s.distIn)+" from the school.");if(s.distOut!=null&&s.distOut>GEOFENCE_M)f.push("Checked out "+fmtDist(s.distOut)+" from the school.")}
  const mins=Math.round((s.endTs-s.startTs)/60000);if(mins<MIN_MIN)f.push("Lasted "+mins+" minutes. Sessions usually take "+MIN_MIN+" or more.");
  const pv=prevInClass(s.schoolId,s.classId,s.startTs,s.id);if(pv){const gap=daysApart(pv.startTs,s.startTs);if(gap<GAP_DAYS)f.push("Held "+(gap===0?"on the same day as":gap+(gap===1?" day after":" days after"))+" activity "+pv.activity+" for this class. The gap between activities should be "+GAP_DAYS+" days or more.")}
  for(const p of s.photos)if(p.kind==="class"&&p.dup){const o=S.sessions[p.dup.sid];f.push(o&&S.schools[o.schoolId]?"Class photo matches one from "+S.schools[o.schoolId].name+", "+fmtDay(o.startTs)+", logged by "+coordName(o.coordId)+".":"Class photo matches an earlier photo.")}
  if(!s.photos.some(p=>p.kind==="class"))f.push("No class photo.");
  if(!s.photos.some(p=>p.kind==="register"))f.push("No attendance register photo.");
  const tot=s.boys+s.girls;if(cl&&tot>cl.enrol)f.push("Reported "+tot+" students. Class "+cl.id+" has "+cl.enrol+" enrolled.");
  s.notes=f;
  const flagged=Object.values(S.flags).some(fl=>fl.about.kind==="session"&&fl.about.id===s.id&&fl.status!=="closed");
  s.status=s.decision||(flagged?"flagged":"pending");return s;
}
const evalAll=()=>Object.values(S.sessions).forEach(evaluate);
const sessions=()=>Object.values(S.sessions).sort((a,b)=>b.startTs-a.startTs);
function cellSession(schoolId,classId,act){let live=null,dead=null;
  for(const s of Object.values(S.sessions)){if(s.schoolId!==schoolId||s.classId!==classId||s.activity!==act)continue;if(s.status==="rejected"){if(!dead||s.startTs>dead.startTs)dead=s}else if(!live||s.startTs>live.startTs)live=s}
  return live||dead}
const activityTaken=(schoolId,classId,act)=>Object.values(S.sessions).some(s=>s.schoolId===schoolId&&s.classId===classId&&s.activity===act&&s.status!=="rejected");
function schoolProgress(sc){let done=0,counted=0;for(const c of sc.classes)for(let a=1;a<=10;a++){const s=cellSession(sc.id,c.id,a);if(s&&s.status!=="rejected")done++;if(s&&s.status==="counted")counted++}return{done,counted,total:sc.classes.length*10}}
/* activities for one class are held at least GAP_DAYS apart */
const mid=ts=>{const d=new Date(ts);d.setHours(0,0,0,0);return d.getTime()},daysApart=(a,b)=>Math.round((mid(b)-mid(a))/864e5);
function prevInClass(schoolId,classId,before,selfId){let p=null;for(const o of Object.values(S.sessions)){if(o.id===selfId||o.schoolId!==schoolId||o.classId!==classId||o.decision==="rejected"||o.startTs>=before)continue;if(!p||o.startTs>p.startTs)p=o}return p}
function classNext(sc,c){let act=0;for(let a=1;a<=10;a++)if(!activityTaken(sc.id,c.id,a)){act=a;break}if(!act)return null;
  const last=prevInClass(sc.id,c.id,Infinity),openTs=last?mid(last.startTs)+GAP_DAYS*864e5:0;return{cls:c.id,act,last,openTs,early:Date.now()<openTs}}
function nextDue(sc){const all=sc.classes.map(c=>classNext(sc,c)).filter(Boolean);if(!all.length)return null;const open=all.filter(n=>!n.early);return open.length?open.sort((a,b)=>a.act-b.act)[0]:all.sort((a,b)=>a.openTs-b.openTs)[0]}
const sessLabel=s=>{const sc=S.schools[s.schoolId];return(sc?sc.name:"School")+", class "+s.classId+", activity "+s.activity+", "+fmtDay(s.startTs)};
/* dashboard scope: a partner sees its own schools; Arogya World sees all, or one partner's */
const inScope=sc=>ui.org==="aw"?(ui.pf==="all"||(sc.partner||"aw")===ui.pf):(sc.partner||"aw")===ui.org;
const scopeSchools=()=>Object.values(S.schools).filter(inScope);
const scopeSessions=()=>sessions().filter(s=>S.schools[s.schoolId]&&inScope(S.schools[s.schoolId]));

/* ---------- Arogya Schools scoring ---------- */

function hspDone(sc){let n=0;for(let a=1;a<=10;a++){if(sc.classes.length&&sc.classes.every(c=>{const s=cellSession(sc.id,c.id,a);return s&&s.status==="counted"}))n++}return n}
function asScore(sc){const t=S.as[sc.id]||{};let e=0,p=0;for(const[g,k,pts,,auto]of CRIT){const got=auto?hspDone(sc)*1.5:(t[k]?pts:0);if(g==="E")e+=got;else p+=got}return{e,p,total:e+p,eligible:e>=75&&p>=5}}

    if(d.step===3&&!d.photos.some(p=>p.kind==="class")){ui.msg="Take the class photo first.";return render()}
    if(d.step===4&&(d.boys===""||d.girls==="")){ui.msg="Enter how many boys and girls are present. Enter 0 if none.";return render()}
    d.step++;render();window.scrollTo(0,0)},
  samplephoto(d){setPhoto(d.kind,AWIT.samplePhoto(Math.floor(Math.random()*1e9),d.kind==="register"?"page":"class"))},
  async checkout(){const d=ui.draft,sc=S.schools[d.schoolId];clearMsg();if(!d.teacher){ui.msg="Say whether the class teacher was present.";return render()}
    const p=await AWIT.getPos(ui.loc,sc.lat!=null?[sc.lat,sc.lng]:null);if(ui.draft!==d)return;const now=Date.now();
    const s={id:uid("s"),schoolId:d.schoolId,classId:d.classId,activity:d.activity,coordId:ui.me,startTs:d.sim?now-40*6e4:d.startTs,endTs:now,distIn:d.distIn,distOut:p.fail||sc.lat==null?null:hav(sc.lat,sc.lng,p.lat,p.lng),noGps:!!d.noGps,sim:d.sim,newAnchor:!!d.newAnchor,
      boys:Math.max(0,parseInt(d.boys,10)||0),girls:Math.max(0,parseInt(d.girls,10)||0),teacherPresent:d.teacher==="yes",remarks:d.remarks.trim(),photos:d.photos};
    S.sessions[s.id]=evaluate(s);save();ui.lastId=s.id;ui.draft=null;ui.screen="result";render();window.scrollTo(0,0)},
  missstart(){ui.miss={schoolId:ui.schoolId,classId:"",reason:"",remarks:""};clearMsg();render();window.scrollTo(0,0)},
  missset(d){ui.miss[d.k]=d.v;render()},
  misscancel(){ui.miss=null;clearMsg();render()},
  misssave(){const d=ui.miss;clearMsg();if(!d.reason){ui.msg="Choose a reason.";return render()}const id=uid("m");S.misses[id]={id,schoolId:d.schoolId,classId:d.classId,coordId:ui.me,ts:Date.now(),reason:d.reason,remarks:d.remarks.trim()};save();ui.miss=null;ui.ok="Your manager has been told.";render()},
  detail(d){const s=S.sessions[d.id];if(s)openDlg(detailHtml(s))},
  close(){closeDlg()},
  decide(d){const s=S.sessions[d.id];if(d.v){s.decision=d.v;s.decidedBy=ui.org;s.decidedTs=Date.now()}else{delete s.decision;delete s.decisionNote}evaluate(s);save();closeDlg();render()},
  rejectask(d){const s=S.sessions[d.id];openDlg('<div class="stack" style="padding:1.25rem"><h2>Do not count this session</h2><p class="muted">'+esc(sessLabel(s))+'</p><div class="field"><label for="rj">Reason, for the coordinator</label><textarea id="rj" rows="2"></textarea></div><div class="row"><button class="btn danger" data-a="reject" data-id="'+s.id+'">Do not count</button><button class="btn quiet" data-a="close">Cancel</button></div></div>')},
  reject(d){const s=S.sessions[d.id];s.decision="rejected";s.decisionNote=$("#rj").value.trim();s.decidedBy=ui.org;s.decidedTs=Date.now();evaluate(s);save();closeDlg();render()},
  countclean(){for(const s of scopeSessions())if(s.status==="pending"&&!s.notes.length){s.decision="counted";s.decidedBy=ui.org;s.decidedTs=Date.now();evaluate(s)}save();render()},
  flag(d){let label,to;if(d.kind==="session"){const s=S.sessions[d.id];label=sessLabel(s);to=S.schools[s.schoolId].partner}else{const sc=S.schools[d.id];label=sc.name;to=sc.partner}
    openDlg(AWIT.flagForm({kind:d.kind,id:d.id,label},to,ORGS))},
  flagsend(d){const note=$("#flag-note").value.trim();if(!note){$("#flag-err").hidden=false;return}const id=uid("f");S.flags[id]={id,about:{kind:d.kind,id:d.id,label:d.label},to:d.to,note,ts:Date.now(),status:"open"};evalAll();save();closeDlg();ui.dtab="flags";render()},
  flagreply(d){const el=$("#fr-"+d.id),txt=el?el.value.trim():"";if(!txt)return;Object.assign(S.flags[d.id],{reply:txt,replyTs:Date.now(),status:"answered"});save();render()},
  flagclose(d){Object.assign(S.flags[d.id],{status:"closed",closedTs:Date.now()});evalAll();save();render()},
  asopen(d){ui.asOpen=ui.asOpen===d.id?null:d.id;render()},
  addschool(){clearMsg();const name=$("#n-name").value.trim(),id=$("#n-udise").value.trim(),classes=parseClasses($("#n-classes").value);
    ui.msg=!name?"Enter the school name.":!/^\d{11}$/.test(id)?"A UDISE code has 11 digits.":S.schools[id]?"A school with this UDISE code is already listed.":!classes.length?"Add at least one class with its enrolment, like 6A: 42.":"";
    if(!ui.msg){S.schools[id]={id,name,block:$("#n-block").value.trim(),project:$("#n-project").value.trim(),partner:$("#n-partner").value,lat:null,lng:null,coordId:$("#n-coord").value,isAS:false,teacher:"",phone:"",classes};save();ui.ok=name+" is added.";}render()},
  editschool(d){ui.msg="";openDlg(editHtml(S.schools[d.id]))},
  saveschool(d){const sc=S.schools[d.id],name=$("#e-name").value.trim(),classes=parseClasses($("#e-classes").value),lost=sc.classes.filter(c=>!classes.some(x=>x.id===c.id)&&Object.values(S.sessions).some(s=>s.schoolId===sc.id&&s.classId===c.id));
    ui.msg=!name?"Enter the school name.":!classes.length?"Add at least one class with its enrolment, like 6A: 42.":lost.length?"Class "+lost[0].id+" has recorded sessions, so it cannot be removed.":"";
    if(ui.msg){$("#dlg").innerHTML=editHtml(sc);return}
    Object.assign(sc,{name,block:$("#e-block").value.trim(),partner:$("#e-partner").value,coordId:$("#e-coord").value,project:$("#e-project").value.trim(),classes,teacher:$("#e-teacher").value.trim(),phone:$("#e-phone").value.replace(/\D/g,"")});
    evalAll();save();closeDlg();render()},
  clearloc(d){const sc=S.schools[d.id];sc.lat=null;sc.lng=null;save();closeDlg();render()},
  delschool(d){delete S.schools[d.id];delete S.as[d.id];save();closeDlg();render()},
  addcoord(){clearMsg();const name=$("#t-name").value.trim(),org=$("#t-org").value,pin=$("#t-pin").value.trim();
    ui.msg=!name?"Enter the coordinator's name.":!/^\d{4}$/.test(pin)?"The PIN must be 4 digits.":S.coords.some(c=>c.name.toLowerCase()===name.toLowerCase()&&c.org===org)?"A coordinator with this name is already listed.":"";if(ui.msg)return render();
    const id=uid("c");S.coords.push({id,name,org,pin:AWIT.pinHash(id,pin)});save();ui.ok=name+" is added. Tell them their PIN.";render()},
  pinreset(d){const c=S.coords.find(x=>x.id===d.id);openDlg('<div class="stack" style="padding:1.25rem"><h2>New PIN for '+esc(c.name)+'</h2><div class="field"><label for="np">PIN, 4 digits</label><input id="np" inputmode="numeric" maxlength="4"></div><p id="np-err" class="note bad small" hidden>The PIN must be 4 digits.</p><div class="row"><button class="btn primary" data-a="pinsave" data-id="'+c.id+'">Save PIN</button><button class="btn quiet" data-a="close">Cancel</button></div></div>')},
  pinsave(d){const pin=$("#np").value.trim();if(!/^\d{4}$/.test(pin)){$("#np-err").hidden=false;return}const c=S.coords.find(x=>x.id===d.id);c.pin=AWIT.pinHash(c.id,pin);save();closeDlg();clearMsg();ui.ok="New PIN saved for "+c.name+".";render()},
  signout(){awitSignOut("schooltrack")}
};
document.addEventListener("click",e=>{const t=e.target.closest("[data-a]");if(!t||t.disabled)return;const fn=A[t.dataset.a];if(fn)fn(t.dataset,t)});
document.addEventListener("input",e=>{const t=e.target,c=t.dataset.c;
  if(c==="count"&&ui.draft)ui.draft[t.dataset.k]=t.value=t.value.replace(/[^\d]/g,"").slice(0,3);
  if(c==="rem"&&ui.draft)ui.draft.remarks=t.value;
  if(c==="missrem"&&ui.miss)ui.miss.remarks=t.value;
  if(c==="pin")ui.pin=t.value.replace(/\D/g,"")});
document.addEventListener("change",async e=>{const t=e.target,c=t.dataset.c;
  if(c==="who"){ui.who=t.value;ui.msg=""}
  if(c==="missreason"&&ui.miss)ui.miss.reason=t.value;
  if(c==="pf"){ui.pf=t.value;render()}
  if(c==="photo"&&t.files&&t.files[0]){const kind=t.dataset.kind;try{setPhoto(kind,await AWIT.fileToPhoto(t.files[0]))}catch(err){ui.msg="That file could not be read as a photo. Try again.";render()}}
  if(c==="crit"){S.as[t.dataset.id]=S.as[t.dataset.id]||{};S.as[t.dataset.id][t.dataset.k]=t.checked?1:0;save();render()}
  if(c==="isas"){S.schools[t.dataset.id].isAS=t.checked;save();render()}
});
$("#dlg").addEventListener("click",e=>{if(e.target===e.currentTarget)closeDlg()});
evalAll();
const start=()=>{unlocked=true;render()};
if(ROLE!=="dash"){$("#rolelab").textContent="Field app, Healthy Schools Program";start()}
else awitSignIn("schooltrack","Arogya SchoolTrack dashboard",Object.keys(ORGS).map(o=>({id:o,name:ORGS[o]}))).then(org=>{ui.org=org;$("#rolelab").textContent="Dashboard, signed in as "+ORGS[org];
  $("#bandlinks").innerHTML=(org==="aw"?'<a href="../../" class="small">Program MIS</a>':"")+'<button class="linkbtn small" data-a="signout">Sign out</button>';start()});
window.addEventListener("storage",e=>{if(e.key===KEY&&loadS()){evalAll();if(unlocked&&!ui.draft&&!ui.miss&&!$("#dlg").open&&!["INPUT","TEXTAREA","SELECT"].includes(document.activeElement.tagName))render()}});
</script>
</body>
</html>
