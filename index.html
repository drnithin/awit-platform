<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Arogya World India Trust: Program MIS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{
  --paper:#F2F6FB; --sheet:#FFFFFF; --ink:#16233F; --ink2:#52617E; --rule:#C7D5E8; --rule2:#E6EDF6;
  --bad:#C4352B; --bad-bg:#FBE9E7; --ok:#1B7648; --ok-bg:#E3F3EA; --wait:#8A5A05; --wait-bg:#FBF0D6;
  --c-hsp:#1D4FC0; --c-as:#1B7648; --c-sfvt:#C26A00; --c-city:#7A3FB5; --c-mute:#9AA9C2;
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#111A2B; --sheet:#18243A; --ink:#EEF2F9; --ink2:#A6B3CB; --rule:#33435F; --rule2:#22304A;
    --bad:#FF9384; --bad-bg:#40221F; --ok:#86D9A9; --ok-bg:#1C3A2C; --wait:#F1C56C; --wait-bg:#3A3018;
    --c-hsp:#8FB0FF; --c-as:#7FD6A4; --c-sfvt:#F2B45A; --c-city:#C9A2F2; --c-mute:#5C6C8A;
  }
}
:root[data-theme="dark"]{
  --paper:#111A2B; --sheet:#18243A; --ink:#EEF2F9; --ink2:#A6B3CB; --rule:#33435F; --rule2:#22304A;
  --bad:#FF9384; --bad-bg:#40221F; --ok:#86D9A9; --ok-bg:#1C3A2C; --wait:#F1C56C; --wait-bg:#3A3018;
  --c-hsp:#8FB0FF; --c-as:#7FD6A4; --c-sfvt:#F2B45A; --c-city:#C9A2F2; --c-mute:#5C6C8A;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
h1,h2,h3{font-family:var(--display);font-weight:700;line-height:1.15;margin:0}
h1{font-size:clamp(1.7rem,3.6vw,2.6rem);letter-spacing:-.015em} h2{font-size:1.05rem} h3{font-size:1rem}
p{margin:0} a{color:inherit}
button,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--c-hsp);outline-offset:2px}
.muted{color:var(--ink2)} .small{font-size:.875rem} .num{font-variant-numeric:tabular-nums}
.wrap{max-width:1280px;margin:0 auto;padding:0 1.25rem}

.bar{border-bottom:2px solid var(--ink);background:var(--sheet)}
.bar .wrap{display:flex;flex-wrap:wrap;gap:.75rem 1.5rem;align-items:center;justify-content:space-between;padding-top:.8rem;padding-bottom:.8rem}
.brand{font-family:var(--display);font-weight:700;font-size:1.2rem}
.brand span{font-weight:500;color:var(--ink2)}
.slicers{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center}
.seg{display:inline-flex;border:1.5px solid var(--ink);border-radius:999px;overflow:hidden;background:var(--sheet)}
.seg button{border:0;background:transparent;padding:.4rem .9rem;min-height:40px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper);font-weight:700}
select{min-height:40px;border:1.5px solid var(--ink);border-radius:999px;background:var(--sheet);padding:0 .9rem}
.pill{display:inline-block;border-radius:999px;padding:.1rem .65rem;font-size:.8125rem;font-weight:700;white-space:nowrap}
.pill.sample{background:var(--wait-bg);color:var(--wait)} .pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.bad{background:var(--bad-bg);color:var(--bad)} .pill.wait{background:var(--wait-bg);color:var(--wait)}

.tabs{display:flex;gap:.25rem;overflow-x:auto;border-bottom:1.5px solid var(--rule);margin:1rem 0 1.25rem}
.tabs button{border:0;background:transparent;padding:.7rem 1rem;min-height:44px;cursor:pointer;white-space:nowrap;border-bottom:4px solid transparent;margin-bottom:-1.5px;color:var(--ink2)}
.tabs button[aria-selected="true"]{color:var(--ink);font-weight:700;border-color:var(--tc,var(--ink))}

.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:1rem}
.tile{background:var(--sheet);border:1.5px solid var(--rule);border-radius:12px;padding:1rem 1.1rem 1.1rem;grid-column:span 12;min-width:0}
.tile>h2{margin-bottom:.15rem} .tile>.sub{color:var(--ink2);font-size:.875rem;margin-bottom:.8rem}
@media (min-width:860px){.s3{grid-column:span 3}.s4{grid-column:span 4}.s5{grid-column:span 5}.s6{grid-column:span 6}.s7{grid-column:span 7}.s8{grid-column:span 8}}
@media (min-width:560px) and (max-width:859px){.s3{grid-column:span 6}}
.lead{grid-column:span 12;padding:.5rem 0 .25rem}
.lead p{font-size:1.1rem;color:var(--ink2);margin-top:.4rem;max-width:60ch}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));grid-column:span 12;border-top:2px solid var(--ink);border-bottom:1px solid var(--rule)}
.kpis div{padding:.8rem 1rem .9rem 0}
.kpis b{display:block;font-family:var(--display);font-size:1.9rem;line-height:1.1}
.pcard{border-top:6px solid var(--pc);cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%}
.pcard b{display:block;font-family:var(--display);font-size:2rem;line-height:1.1;margin-top:.35rem}
.pcard .go{display:inline-block;margin-top:.6rem;font-weight:700;color:var(--pc)}
.pcard:hover{border-color:var(--pc)}

.hb{display:grid;grid-template-columns:minmax(110px,40%) 1fr auto;gap:.3rem .7rem;align-items:center}
.hb .lab{line-height:1.25;padding:.15rem 0}
.hb .track{position:relative;height:16px;background:var(--rule2);border-radius:3px}
.hb .fill{position:absolute;left:0;top:0;bottom:0;border-radius:3px}
.hb .fill2{position:absolute;left:0;top:4px;bottom:4px;border-radius:2px;background:var(--ink);opacity:.85}
.hb .mark{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink)}
.hb .val{font-variant-numeric:tabular-nums;font-weight:700;text-align:right}
.rank{display:inline-block;width:1.6rem;color:var(--ink2);font-variant-numeric:tabular-nums}
.funnel .frow{display:grid;grid-template-columns:minmax(110px,30%) 1fr 4.5rem;gap:.7rem;align-items:center;margin:.3rem 0}
.funnel .fbar{height:26px;border-radius:4px;margin:0 auto}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:.5rem .6rem;border-bottom:1px solid var(--rule2);vertical-align:middle}
th{color:var(--ink2);font-size:.875rem;font-weight:700}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.heat td.n{border-left:1px solid var(--rule2)}
.legend{display:flex;flex-wrap:wrap;gap:.3rem 1rem;font-size:.875rem;margin-top:.5rem}
.legend i{display:inline-block;width:12px;height:12px;border-radius:2px;margin-right:.35rem;vertical-align:-1px}
.donut{display:flex;flex-wrap:wrap;gap:1rem;align-items:center}
.donut svg{width:150px;height:150px;flex:none}
.gantt .grow{display:grid;grid-template-columns:minmax(120px,32%) 1fr;gap:.7rem;align-items:center;margin:.35rem 0}
.gantt .gtrack{position:relative;height:22px;background:var(--rule2);border-radius:3px}
.gantt .gbar{position:absolute;top:0;bottom:0;border-radius:3px}
.gantt .now{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--bad)}
.gaxis{display:grid;grid-template-columns:minmax(120px,32%) 1fr;gap:.7rem;font-size:.8125rem;color:var(--ink2)}
.gaxis div:last-child{display:flex;justify-content:space-between}
.tools a{display:block;padding:.6rem 0;border-bottom:1px solid var(--rule2);font-weight:700;text-decoration:none}
.tools a span{display:block;font-weight:400;color:var(--ink2);font-size:.875rem}
.tools a:last-child{border-bottom:0}
svg text{font-family:var(--body);fill:var(--ink2);font-size:11px}
.foot{color:var(--ink2);font-size:.875rem;padding:1.5rem 0 3rem}
.empty{color:var(--ink2);padding:1rem 0}
</style>
</head>

<script>
"use strict";
/* ---------- sample data model: replace with the shared data core feed ---------- */
const MN=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const MONTHS=[];for(let i=0;i<21;i++)MONTHS.push({y:2025+Math.floor(i/12),m:i%12});
const D={blr:{name:"Bengaluru Urban",st:"Karnataka"},mys:{name:"Mysuru",st:"Karnataka"},mum:{name:"Mumbai",st:"Maharashtra"},vad:{name:"Vadodara",st:"Gujarat"},nar:{name:"Narmada",st:"Gujarat"}};
const PR={
  hsp:{name:"Healthy Schools",unit:"students",site:"schools",c:"var(--c-hsp)"},
  as:{name:"Arogya Schools",unit:"students in nominee schools",site:"nominee schools",c:"var(--c-as)"},
  sfvt:{name:"Street Food Vendor Training",unit:"vendors",site:"stalls",c:"var(--c-sfvt)"},
  city:{name:"Arogya City",unit:"people covered by delivered pledges",site:"pledgemakers",c:"var(--c-city)"}};
const rng=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const R0=rng(5102026);
const ROWS=[
 ["hsp","blr",52000,210,"School partner, Bengaluru",0,.90],["hsp","mys",18000,80,"School partner, Mysuru",5,.93],
 ["hsp","mum",24000,95,"School partner, Mumbai",12,.84],["hsp","vad",61000,260,"School partner, Vadodara",0,.91],
 ["hsp","nar",33000,150,"School partner, Narmada",2,.88],
 ["as","blr",6100,18,"School partner, Bengaluru",6,.92],["as","mys",2300,8,"School partner, Mysuru",9,.94],
 ["as","vad",7900,22,"School partner, Vadodara",6,.93],["as","nar",3800,12,"School partner, Narmada",8,.90],
 ["sfvt","blr",780,780,"Vendor association, Bengaluru",2,.87],["sfvt","mum",340,340,"Vendor association, Mumbai",17,.78],
 ["city","blr",96000,64,"Arogya City partners, Bengaluru",0,.82],["city","mum",8500,21,"Arogya City partners, Mumbai",16,.55]
].map(([p,d,people,sites,partner,start,vr])=>{
  const w=MONTHS.map((mo,i)=>i<start?0:((p==="hsp"||p==="as")&&(mo.m===3||mo.m===4)?.2:1)*(.65+.7*R0())*(1+i/40));
  const tw=w.reduce((a,b)=>a+b,0);let mon=w.map(x=>Math.round(people*x/tw));mon[20]+=people-mon.reduce((a,b)=>a+b,0);
  return{p,d,people,sites,partner,start,vr,mon};
});
const HSPD={blr:{c:[.97,.58],att:.91,k:[[46,72],[51,70],[60,84]]},mys:{c:[.98,.66],att:.93,k:[[44,74],[50,73],[58,85]]},
  mum:{c:[.90,.22],att:.86,k:[[47,58],[52,60],[62,70]]},vad:{c:[.98,.71],att:.92,k:[[42,75],[49,72],[57,86]]},nar:{c:[.95,.55],att:.89,k:[[39,70],[47,69],[55,82]]}};
const COORDS=[["Lakshmi R","blr",.96],["Manjunath K","blr",.91],["Fathima S","blr",.88],["Suresh P","mys",.94],["Anita D","mum",.83],["Rahul M","mum",.79],
  ["Hetal P","vad",.95],["Kiran B","vad",.92],["Jignesh V","vad",.86],["Sunita T","nar",.90],["Bhavesh R","nar",.84]].map(([name,d,auto])=>({name,d,auto,share:.7+.6*R0()}));
const FLAGS=[["Outside the school at check-in",.22],["Session too short",.18],["School disputed or did not confirm",.18],["No attendance register photo",.16],["Count above enrolment",.14],["Reused photo",.12]];
const ASMAX=[12,15,3,10,10,10,5,10],ASLAB=["School Health Committee formed","HSP activities completed","HSP manuals in the library","KAP baseline and endline surveys","Annual sports event","Sugar and Oil boards","School demographic survey","Objective measurements"];
const ASS=[];(()=>{const r=rng(8080);for(const row of ROWS.filter(x=>x.p==="as"))for(let i=1;i<=row.sites;i++){
  const m=.35+.65*r(),b=x=>r()<x?1:0;let e,p;
  if(m>=.9){e=ASMAX.slice();p=5+Math.floor(r()*18)}
  else{e=[12*b(m+.15),1.5*Math.min(10,Math.round(10*m*(.85+.3*r()))),1.5*(b(m)+b(m)),2.5*(b(m)+b(m)+b(m)+b(m)),10*b(m-.1),5*(b(m+.1)+b(m)),5*b(m+.2),5*(b(m)+b(m-.25))];p=Math.round(25*m*(.3+.5*r()))}
  const es=e.reduce((a,c)=>a+c,0);ASS.push({name:D[row.d].name+" school "+String(i).padStart(2,"0"),d:row.d,e,es,p,total:es+p,seal:es===75&&p>=5})}})();
const SF={blr:{st:[1,.94,.88,.79,.71,.63,.55],beh:[[38,69],[45,66],[29,52],[51,78]],women:.58,scr:[.27,.19,.34]},
          mum:{st:[1,.90,.72,.41,.18,0,0],beh:[[33,44],[41,49],[24,31],[46,58]],women:.64,scr:[.31,.22,.39]}};
const SFSTAGES=["Registered at the stall","Baseline and screening","Trained","Follow-up visit 1","Follow-up visit 2","Follow-up visit 3","Endline"];
const SFBEH=["Fresh oil, no repeated reuse","Measured salt","Healthier cooking oil","Hygiene checklist passed"];
const WARDS=[["Shivajinagar","blr",310,.91],["KR Market","blr",290,.88],["Johnson Market","blr",180,.84],["Govandi","mum",340,.72]];
const CITY={blr:{name:"Bengaluru",base:[54,38,41,47,33,44,68,39,42],mirror:[[250000,82000,57000],[180000,34000,22500],[150000,21000,13500],[90000,5000,3000]],close:[41,15,8],sect:[20,10,9,8,7,6,4]},
            mum:{name:"Mumbai",base:[46,22,49,40,29,41,61,36,38],mirror:[[300000,18000,6000],[200000,7000,1500],[170000,5000,1000],[100000,1000,0]],close:[6,9,6],sect:[4,4,3,3,2,2,3]}};
const BASELAB=["Air quality","Public open space","Walkability","Food environment","Screening coverage","Physical activity","Tobacco-free living","Diabetes burden","Hypertension burden"];
const CAUSES=["Health screening","Physical activity","Healthy food","Tobacco-free campuses"];
const SECT=["IT and technology","Healthcare","Education","Manufacturing","Housing societies","Food and hospitality","Government and public sector"];
const PLEDGERS=[["IT services firm","blr",18000,16900],["Hospital group","blr",15000,12600],["Technology park","blr",12000,11400],["University","blr",9000,5200],["Apartment federation","blr",8000,6900],
  ["Garment exporter","blr",7000,2100],["Restaurant chain","blr",6000,5700],["Public sector unit","blr",5000,1500],["Bank, regional office","mum",6000,2900],["Pharma company","mum",5000,1800],["Hotel group","mum",4000,900],["Housing society cluster","mum",3000,1400]];
const PROJECTS=[["Healthy Schools, Gujarat","hsp","Gujarat",0,26,"Funder A"],["Healthy Schools, Karnataka","hsp","Karnataka",5,28,"Funder B"],["Healthy Schools, Mumbai","hsp","Maharashtra",12,30,"Funder C"],
  ["Arogya Schools accreditation","as","Gujarat",6,29,"Funder A"],["Street food vendors, Bengaluru","sfvt","Karnataka",2,23,"Funder D"],["Nourishing Govandi, Mumbai","sfvt","Maharashtra",19,31,"CSR partner"],
  ["Arogya City Bengaluru, Edition II","city","Karnataka",0,23,"City partners"],["Arogya City Mumbai","city","Maharashtra",16,35,"City partners"]];
const TOOLS={hsp:[["Arogya SchoolTrack","Field app and review queue for school sessions","schooltrack/"]],
  as:[["Arogya SchoolTrack","Accreditation scoreboard for each nominee school","schooltrack/"]],
  sfvt:[["Street Food Vendor Training tool","Vendor registration, training day desks, stall visits and integrity queue","sfvt/"]],
  city:[["Arogya City pledge closeout","Organisation-wise closeout progress","https://drnithin.github.io/arogya-city2026/admin/dashboard.html"],["Arogya City Impact Wall","Public page of pledges delivered","https://drnithin.github.io/arogya-city2026/wall.html"]]};

/* ---------- helpers ---------- */
const ui={tab:"overview",year:"all",state:"all"};
const $=s=>document.querySelector(s);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nf=n=>Math.round(n).toLocaleString("en-IN");
const pct=x=>Math.round(x*100)+"%";
const sum=a=>a.reduce((x,y)=>x+y,0);
const compact=n=>n>=1e5?(n/1e5).toFixed(n>=1e6?1:2).replace(/\.?0+$/,"")+" L":n>=1e3?(n/1e3).toFixed(n>=1e4?0:1).replace(/\.0$/,"")+"k":String(Math.round(n));
const inPeriod=i=>ui.year==="all"||String(MONTHS[i].y)===ui.year;
const inState=d=>ui.state==="all"||D[d].st===ui.state;
const periodText=()=>(ui.year==="all"?"January 2025 to September 2026":ui.year==="2026"?"January to September 2026":"January to December 2025")+(ui.state==="all"?"":", "+ui.state);
function sel(p){return ROWS.filter(r=>(!p||r.p===p)&&inState(r.d)).map(r=>{const mon=r.mon.map((v,i)=>inPeriod(i)?v:0),people=sum(mon),frac=people/r.people;
  return Object.assign({},r,{monF:mon,peopleF:people,frac,sitesF:people?Math.max(1,Math.round(r.sites*frac)):0})}).filter(r=>r.peopleF>0)}
const wavg=(rows,f)=>{const w=sum(rows.map(r=>r.peopleF));return w?sum(rows.map(r=>f(r)*r.peopleF))/w:0};
const tile=(span,title,sub,body)=>'<section class="tile '+span+'"><h2>'+title+"</h2>"+(sub?'<p class="sub">'+sub+"</p>":"")+body+"</section>";
const kpis=list=>'<div class="kpis">'+list.map(([v,l])=>'<div><b class="num">'+v+'</b><span class="muted">'+l+"</span></div>").join("")+"</div>";
const lead=(h,p)=>'<div class="lead"><h1>'+h+"</h1><p>"+p+"</p></div>";
const noWork=what=>'<div class="tile"><p class="empty">'+what+" has no work in "+esc(ui.state)+" in this period. Change the state or year above.</p></div>";

function hbars(items,o){o=o||{};const max=o.max||Math.max(1,...items.map(i=>i.value));
  return '<div class="hb">'+items.map((it,k)=>'<div class="lab" title="'+esc(it.label)+'">'+(o.rank?'<span class="rank">'+(k+1)+"</span>":"")+esc(it.label)+(it.tag||"")+"</div>"+
   '<div class="track"><div class="fill" style="width:'+Math.min(100,it.value/max*100)+"%;background:"+(it.color||o.color||"var(--c-hsp)")+'"></div>'+
   (it.value2!=null?'<div class="fill2" style="width:'+Math.min(100,it.value2/max*100)+'%"></div>':"")+(o.mark!=null?'<div class="mark" style="left:'+(o.mark/max*100)+'%"></div>':"")+"</div>"+
   '<div class="val">'+(it.text||(o.fmt?o.fmt(it.value):nf(it.value)))+"</div>").join("")+"</div>"}
function axis(max,W,H,L,B,fmt){let g="";for(let t=0;t<=4;t++){const y=H-B-(H-B-10)*t/4;g+='<line x1="'+L+'" x2="'+W+'" y1="'+y+'" y2="'+y+'" stroke="var(--rule2)"/><text x="'+(L-6)+'" y="'+(y+4)+'" text-anchor="end">'+fmt(max*t/4)+"</text>"}return g}
function stacked(series){const W=720,H=250,L=46,B=26,idx=MONTHS.map((_,i)=>i).filter(inPeriod),tot=idx.map(i=>sum(series.map(s=>s.vals[i]))),max=Math.max(1,...tot)*1.08,bw=(W-L)/idx.length;
  let g=axis(max,W,H,L,B,compact);
  idx.forEach((i,k)=>{let y=H-B;for(const s of series){const h=(H-B-10)*s.vals[i]/max;y-=h;g+='<rect x="'+(L+k*bw+bw*.14)+'" y="'+y+'" width="'+bw*.72+'" height="'+Math.max(0,h)+'" fill="'+s.color+'"><title>'+esc(s.name)+", "+MN[MONTHS[i].m]+" "+MONTHS[i].y+": "+nf(s.vals[i])+"</title></rect>"}
    if(idx.length<=12||k%3===0)g+='<text x="'+(L+k*bw+bw/2)+'" y="'+(H-8)+'" text-anchor="middle">'+MN[MONTHS[i].m]+" "+String(MONTHS[i].y).slice(2)+"</text>"});
  return '<svg viewBox="0 0 '+W+" "+H+'" width="100%" role="img" aria-label="Monthly totals by program">'+g+"</svg>"+'<div class="legend">'+series.map(s=>'<span><i style="background:'+s.color+'"></i>'+esc(s.name)+"</span>").join("")+"</div>"}
function vbars(labels,vals,color,o){o=o||{};const W=520,H=230,L=40,B=26,max=o.max||Math.max(1,...vals)*1.1,bw=(W-L)/vals.length;let g=axis(max,W,H,L,B,o.fmt||compact);
  vals.forEach((v,k)=>{const h=(H-B-10)*v/max;g+='<rect x="'+(L+k*bw+bw*.18)+'" y="'+(H-B-h)+'" width="'+bw*.64+'" height="'+h+'" rx="2" fill="'+color+'"><title>'+esc(labels[k])+": "+(o.fmt?o.fmt(v):nf(v))+"</title></rect>"+
    '<text x="'+(L+k*bw+bw/2)+'" y="'+(H-B-h-4)+'" text-anchor="middle" style="fill:var(--ink);font-weight:700">'+(o.fmt?o.fmt(v):compact(v))+'</text><text x="'+(L+k*bw+bw/2)+'" y="'+(H-8)+'" text-anchor="middle">'+esc(labels[k])+"</text>"});
  return '<svg viewBox="0 0 '+W+" "+H+'" width="100%" role="img" aria-label="'+esc(o.aria||"Bar chart")+'">'+g+"</svg>"}
function grouped(cats,series){const W=520,H=240,L=40,B=40,max=100,gw=(W-L)/cats.length,bw=gw*.36;let g=axis(max,W,H,L,B,v=>Math.round(v)+"%");
  cats.forEach((c,k)=>{series.forEach((s,j)=>{const v=s.vals[k],h=(H-B-10)*v/max,x=L+k*gw+gw*.12+j*(bw+3);
    g+='<rect x="'+x+'" y="'+(H-B-h)+'" width="'+bw+'" height="'+h+'" rx="2" fill="'+s.color+'"><title>'+esc(c)+", "+esc(s.name)+": "+Math.round(v)+'%</title></rect><text x="'+(x+bw/2)+'" y="'+(H-B-h-4)+'" text-anchor="middle" style="fill:var(--ink);font-weight:700">'+Math.round(v)+"</text>"});
    const words=c.split(" "),mid=Math.ceil(words.length/2);g+='<text x="'+(L+k*gw+gw/2)+'" y="'+(H-24)+'" text-anchor="middle">'+esc(words.slice(0,mid).join(" "))+'</text><text x="'+(L+k*gw+gw/2)+'" y="'+(H-11)+'" text-anchor="middle">'+esc(words.slice(mid).join(" "))+"</text>"});
  return '<svg viewBox="0 0 '+W+" "+H+'" width="100%" role="img" aria-label="Baseline against latest">'+g+"</svg>"+'<div class="legend">'+series.map(s=>'<span><i style="background:'+s.color+'"></i>'+esc(s.name)+"</span>").join("")+"</div>"}
function area(vals,color){const W=720,H=220,L=46,B=26,idx=MONTHS.map((_,i)=>i).filter(inPeriod),v=idx.map(i=>vals[i]),max=Math.max(1,...v)*1.12,st=(W-L-10)/Math.max(1,idx.length-1);
  const pts=v.map((x,k)=>[L+5+k*st,H-B-(H-B-10)*x/max]);let g=axis(max,W,H,L,B,compact);
  g+='<path d="M'+pts[0][0]+" "+(H-B)+" "+pts.map(p=>"L"+p[0]+" "+p[1]).join(" ")+" L"+pts[pts.length-1][0]+" "+(H-B)+'Z" fill="'+color+'" opacity=".16"/><polyline points="'+pts.map(p=>p.join(",")).join(" ")+'" fill="none" stroke="'+color+'" stroke-width="2.5"/>';
  pts.forEach((p,k)=>{g+='<circle cx="'+p[0]+'" cy="'+p[1]+'" r="3.5" fill="'+color+'"><title>'+MN[MONTHS[idx[k]].m]+" "+MONTHS[idx[k]].y+": "+nf(v[k])+"</title></circle>";
    if(idx.length<=12||k%3===0)g+='<text x="'+p[0]+'" y="'+(H-8)+'" text-anchor="middle">'+MN[MONTHS[idx[k]].m]+" "+String(MONTHS[idx[k]].y).slice(2)+"</text>"});
  return '<svg viewBox="0 0 '+W+" "+H+'" width="100%" role="img" aria-label="Monthly trend">'+g+"</svg>"}
function spark(vals,color){const idx=MONTHS.map((_,i)=>i).filter(inPeriod),v=idx.map(i=>vals[i]),max=Math.max(1,...v),st=120/Math.max(1,v.length-1);
  return '<svg viewBox="0 0 120 34" width="100%" height="34" preserveAspectRatio="none" aria-hidden="true"><polyline points="'+v.map((x,k)=>(k*st).toFixed(1)+","+(31-28*x/max).toFixed(1)).join(" ")+'" fill="none" stroke="'+color+'" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>'}
function donut(parts,centre,centreLab){const tot=sum(parts.map(p=>p.value))||1;let off=25,g="";
  for(const p of parts){const f=p.value/tot*100;g+='<circle cx="21" cy="21" r="15.915" fill="none" stroke="'+p.color+'" stroke-width="6" stroke-dasharray="'+f+" "+(100-f)+'" stroke-dashoffset="'+off+'"><title>'+esc(p.label)+": "+nf(p.value)+"</title></circle>";off-=f}
  return '<div class="donut"><svg viewBox="0 0 42 42" role="img" aria-label="'+esc(centreLab)+'">'+g+'<text x="21" y="21.5" text-anchor="middle" style="font-size:6.5px;font-weight:700;fill:var(--ink);font-family:var(--display)">'+centre+'</text><text x="21" y="26.5" text-anchor="middle" style="font-size:2.6px">'+esc(centreLab)+"</text></svg>"+
    '<div class="legend" style="flex-direction:column;margin:0">'+parts.map(p=>'<span><i style="background:'+p.color+'"></i>'+esc(p.label)+' <b class="num">'+pct(p.value/tot)+"</b></span>").join("")+"</div></div>"}
function funnel(steps,color){const max=Math.max(1,steps[0].value);return '<div class="funnel">'+steps.map((s,k)=>'<div class="frow"><div>'+esc(s.label)+'</div><div><div class="fbar" style="width:'+Math.max(1.5,s.value/max*100)+"%;background:"+color+";opacity:"+(1-k*.09)+'"></div></div><div class="num" style="text-align:right"><b>'+nf(s.value)+'</b> <span class="muted small">'+pct(s.value/max)+"</span></div></div>").join("")+"</div>"}
const STAT=[["Verified","var(--ok)"],["Waiting for confirmation","var(--wait)"],["Under review","var(--bad)"],["Not counted","var(--c-mute)"]];
const statusParts=(n,vr)=>[n*vr,n*(1-vr)*.35,n*(1-vr)*.45,n*(1-vr)*.2];
const records=r=>r.p==="hsp"?r.peopleF/38*6.2:r.p==="sfvt"?r.peopleF*4.6:r.p==="city"?r.sitesF*1.6:0;
function statusDonut(rows,lab){const t=[0,0,0,0];for(const r of rows){const s=statusParts(records(r),r.vr);s.forEach((v,i)=>t[i]+=v)}
  return donut(STAT.map(([l,c],i)=>({label:l,color:c,value:t[i]})),pct(t[0]/(sum(t)||1)),lab)}
const toolsTile=(span,keys)=>tile(span,"Open the working tools","The MIS reads from these. Each one is where the data is entered and checked.",'<div class="tools">'+keys.flatMap(k=>TOOLS[k]).filter((t,i,a)=>a.findIndex(x=>x[0]===t[0])===i).map(([n,d,u])=>'<a href="'+u+'" target="_blank" rel="noopener">'+esc(n)+"<span>"+esc(d)+"</span></a>").join("")+"</div>");


/* ---------- live numbers from the tools on this device ---------- */
function liveGet(k){try{const r=localStorage.getItem(k);return r?JSON.parse(r):null}catch(e){return null}}
const LIVE_T=n=>n+' <span class="pill ok">Live</span>',LIVE_NONE="The tool has no records on this device yet, or this page is not on the same site as the tool. Open the tool below, add a record, and come back.";
function liveSfvt(){
  const d=liveGet("sfvt.v2");if(!d||!d.vendors||!Object.keys(d.vendors).length)return tile("",LIVE_T("Live from the vendor training tool"),"",'<p class="muted">'+LIVE_NONE+"</p>");
  const vs=Object.values(d.vendors).filter(v=>v.review!=="rejected"),xs=Object.values(d.visits||{}).filter(x=>x.status==="verified"),has=t=>new Set(xs.filter(x=>x.type===t).map(x=>x.vid)).size;
  const tr=Object.values(d.trainings||{}),inv=sum(tr.map(t=>(t.invited||[]).length)),att=vs.filter(v=>v.att).length;
  return tile("",LIVE_T("Live from the vendor training tool"),"Real records from the field tool on this device, not sample data. It updates when you come back to this page.",
    kpis([[vs.length,"vendors registered"],[att,"came to a training"+(inv?", of "+inv+" invited":"")],[vs.filter(v=>v.scr&&!v.scr.declined).length,"screened"],[vs.filter(v=>v.kit&&v.kit.trained).length,"trained"],[vs.filter(v=>v.kit&&v.kit.apron).length,"aprons given"]])+
    '<div style="margin-top:1rem">'+funnel([["Registered",vs.length],["Came to training",att],["Trained",vs.filter(v=>v.kit&&v.kit.trained).length],["Visit 1",has("tp1")],["Visit 2",has("tp2")],["Visit 3",has("tp3")],["Endline",has("endline")]].map(([label,value])=>({label,value})),"var(--c-sfvt)")+"</div>");
}
function liveHsp(){
  const d=liveGet("schooltrack.v1");if(!d||!d.sessions||!Object.keys(d.sessions).length)return tile("",LIVE_T("Live from SchoolTrack"),"",'<p class="muted">'+LIVE_NONE+"</p>");
  const ss=Object.values(d.sessions),ver=ss.filter(s=>s.status==="verified");let reach=0,schools=0;
  for(const sc of Object.values(d.schools||{})){let any=false;for(const c of sc.classes||[])if(ver.some(s=>s.schoolId===sc.id&&s.classId===c.id)){reach+=c.enrol;any=true}if(any)schools++}
  return tile("",LIVE_T("Live from SchoolTrack"),"Real records from the field tool on this device, not sample data. It updates when you come back to this page.",
    kpis([[schools,"schools with verified sessions"],[nf(reach),"students reached"],[ver.length,"verified sessions"],[ss.filter(s=>s.status==="waiting").length,"waiting for the school"],[ss.filter(s=>s.status==="review").length,"in the review queue"]]));
}

  return h;
}
const CITYNAME=d=>d==="blr"?"Bengaluru":d==="mum"?"Mumbai":D[d].name;
function city(){
  const rows=sel("city");if(!rows.length)return noWork("Arogya City");
  const cs=rows.map(r=>r.d),makers=sum(rows.map(r=>r.sites)),mir=CAUSES.map((_,i)=>[0,1,2].map(j=>sum(cs.map(c=>CITY[c].mirror[i][j])))),pledged=sum(mir.map(m=>m[1])),delivered=sum(mir.map(m=>m[2])),cl=[0,1,2].map(j=>sum(cs.map(c=>CITY[c].close[j])));
  let h=lead(nf(delivered)+" people covered by pledges delivered","Arogya City in "+cs.map(c=>CITY[c].name).join(" and ")+", current status. Each pledge is tied to one measurable cause from the city's NCD baseline.");
  h+=kpis([[makers,"pledgemakers"],[nf(pledged),"people pledged"],[nf(delivered),"people delivered"],[pct(delivered/pledged),"of pledges delivered"],[pct(cl[0]/sum(cl)),"of organisations closed out"]]);
  h+=tile("s7","The mirror: city need, pledged and delivered","For each cause, the light bar is people pledged and the dark bar is people delivered. The percentage is how much of the city's gap the pledges cover.",
    hbars(CAUSES.map((l,i)=>({label:l,value:mir[i][1],value2:mir[i][2],text:compact(mir[i][2])+" of "+compact(mir[i][1])+", "+pct(mir[i][1]/mir[i][0])+" of gap",color:"color-mix(in srgb,var(--c-city) 45%,transparent)"})),{})+
    '<div class="legend"><span><i style="background:color-mix(in srgb,var(--c-city) 45%,transparent)"></i>Pledged</span><span><i style="background:var(--ink)"></i>Delivered</span></div>');
  h+=tile("s5","Closeout progress","Organisations by closeout status.",donut([["Submitted","var(--ok)"],["In progress","var(--wait)"],["Not opened","var(--c-mute)"]].map(([l,c],i)=>({label:l,color:c,value:cl[i]})),String(sum(cl)),"organisations"));
  for(const c of cs)h+=tile(cs.length>1?"s6":"s7",CITY[c].name+" NCD baseline","Score out of 100 on each measurable cause. Higher is healthier, and the line marks the target of 70.",
    hbars(BASELAB.map((l,i)=>({label:l,value:CITY[c].base[i],text:String(CITY[c].base[i]),color:CITY[c].base[i]<40?"var(--bad)":CITY[c].base[i]<55?"var(--c-sfvt)":"var(--c-as)"})),{max:100,mark:70}));
  const pm=PLEDGERS.filter(p=>cs.includes(p[1])).map(([n,d,pl,dl])=>({label:n,value:pl,value2:dl,text:pct(dl/pl)+" of "+compact(pl),tag:' <span class="small muted">'+CITY[d].name+"</span>",r:dl/pl})).sort((a,b)=>b.r-a.r);
  h+=tile(cs.length>1?"s7":"s5","Pledgemaker leaderboard","Ranked by share of the pledge delivered. Light bar is pledged, dark bar is delivered.",hbars(pm,{rank:true,color:"color-mix(in srgb,var(--c-city) 45%,transparent)"}));
  const sec=SECT.map((l,i)=>({label:l,value:sum(cs.map(c=>CITY[c].sect[i]))})).sort((a,b)=>b.value-a.value);
  h+=tile("s5","Who is pledging","Pledgemakers by sector.",hbars(sec,{color:"var(--c-city)"}));
  h+=tile("s7","People covered each month","People covered by pledges as organisations report delivery.",area(MONTHS.map((_,i)=>sum(rows.map(r=>r.monF[i]))),"var(--c-city)"));
  h+=toolsTile("s5",["city"]);
  return h;
}
const TABS=[["overview","Organisation overview","var(--ink)"],["hsp","Healthy Schools",PR.hsp.c],["as","Arogya Schools",PR.as.c],["sfvt","Street Food Vendor Training",PR.sfvt.c],["city","Arogya City",PR.city.c]];
const VIEWS={overview,hsp,as,sfvt,city};
function render(){
  $("#tabs").innerHTML=TABS.map(([k,l,c])=>'<button role="tab" data-a="tab" data-v="'+k+'" aria-selected="'+(ui.tab===k)+'" style="--tc:'+c+'">'+l+"</button>").join("");
  document.querySelectorAll('[data-a="year"]').forEach(b=>b.setAttribute("aria-pressed",b.dataset.v===ui.year));
  $("#app").innerHTML=VIEWS[ui.tab]();
}
document.addEventListener("click",e=>{const t=e.target.closest("[data-a]");if(!t)return;
  if(t.dataset.a==="tab"){ui.tab=t.dataset.v;render();window.scrollTo(0,0)}
  if(t.dataset.a==="year"){ui.year=t.dataset.v;render()}});
document.addEventListener("change",e=>{if(e.target.dataset.c==="state"){ui.state=e.target.value;render()}});
window.addEventListener("storage",render);document.addEventListener("visibilitychange",()=>{if(!document.hidden)render()});
render();
</script>
