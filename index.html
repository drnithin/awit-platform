<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Arogya SchoolTrack</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F2F6FB; --sheet:#FFFFFF; --ink:#16233F; --ink2:#52617E; --rule:#C7D5E8; --rule2:#E3EBF5;
  --margin:#C4352B; --margin-bg:#FBE9E7; --tick:#1B7648; --tick-bg:#E3F3EA; --wait:#8A5A05; --wait-bg:#FBF0D6;
  --accent:#1D4FC0; --accent-ink:#FFFFFF;
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#13201B; --sheet:#1A2A24; --ink:#EEF3EC; --ink2:#A7B7AD; --rule:#35493F; --rule2:#26372F;
    --margin:#FF9384; --margin-bg:#3B2320; --tick:#86D9A9; --tick-bg:#1F3A2C; --wait:#F1C56C; --wait-bg:#3A3018;
    --accent:#A9C3FF; --accent-ink:#10203F;
  }
}
:root[data-theme="dark"]{
  --paper:#13201B; --sheet:#1A2A24; --ink:#EEF3EC; --ink2:#A7B7AD; --rule:#35493F; --rule2:#26372F;
  --margin:#FF9384; --margin-bg:#3B2320; --tick:#86D9A9; --tick-bg:#1F3A2C; --wait:#F1C56C; --wait-bg:#3A3018;
  --accent:#A9C3FF; --accent-ink:#10203F;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
h1,h2,h3{font-family:var(--display);font-weight:700;line-height:1.15;margin:0}
h1{font-size:1.75rem} h2{font-size:1.25rem} h3{font-size:1.05rem}
p{margin:0}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.muted{color:var(--ink2)} .small{font-size:.875rem} .num{font-variant-numeric:tabular-nums}

.bar{display:flex;flex-wrap:wrap;gap:.75rem 1.5rem;align-items:center;justify-content:space-between;padding:.9rem 1.25rem;border-bottom:2px solid var(--ink)}
.brand{font-family:var(--display);font-weight:700;font-size:1.3rem;letter-spacing:-.01em}
.brand span{color:var(--ink2);font-weight:500}
.seg{display:inline-flex;border:1.5px solid var(--ink);border-radius:999px;overflow:hidden;background:var(--sheet)}
.seg button{border:0;background:transparent;padding:.5rem 1rem;min-height:44px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper);font-weight:700}

.btn{border:1.5px solid var(--ink);background:var(--sheet);border-radius:10px;padding:.65rem 1rem;min-height:48px;cursor:pointer;font-weight:700}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{border-color:var(--margin);color:var(--margin)}
.btn.quiet{border-color:var(--rule);font-weight:400}
.btn.block{display:block;width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center}
.stack>*+*{margin-top:1rem}

.pill{display:inline-block;border-radius:999px;padding:.1rem .65rem;font-size:.8125rem;font-weight:700;white-space:nowrap}
.pill.ok{background:var(--tick-bg);color:var(--tick)} .pill.wait{background:var(--wait-bg);color:var(--wait)}
.pill.rev{background:var(--margin-bg);color:var(--margin)} .pill.bad{background:var(--ink);color:var(--paper)}

/* field app */
.phone{max-width:460px;margin:0 auto;padding:1.25rem 1rem 3rem}
.sheet{background:var(--sheet);border:1.5px solid var(--rule);border-radius:14px;padding:1rem}
.schoolcard{display:flex;gap:.75rem;align-items:center;justify-content:space-between}
.demo{border:1.5px dashed var(--ink2);border-radius:14px;padding:.85rem 1rem;background:transparent}
.demo .seg button{padding:.4rem .75rem;min-height:40px;font-size:.9rem}
.list{list-style:none;margin:0;padding:0}
.list li{padding:.7rem 0;border-bottom:1px solid var(--rule)}
.list li:last-child{border-bottom:0}
.steps{display:flex;gap:6px;margin:.4rem 0 1rem}
.steps i{flex:1;height:6px;border-radius:3px;background:var(--rule)} .steps i.on{background:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:.5rem}
.chip{min-width:48px;min-height:48px;border-radius:10px;border:1.5px solid var(--ink);background:var(--sheet);cursor:pointer;font-weight:700;padding:0 .8rem}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.chip:disabled{border-color:var(--rule);color:var(--ink2);cursor:not-allowed;text-decoration:line-through}
.field label{display:block;font-weight:700;margin-bottom:.25rem}
.field input,.field select{width:100%;min-height:48px;border:1.5px solid var(--ink);border-radius:10px;padding:.5rem .75rem;background:var(--sheet)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}
.thumb{width:132px;max-width:100%;border-radius:8px;border:1.5px solid var(--rule);display:block}
.note{border-left:4px solid var(--ink2);padding:.35rem .75rem;border-radius:0}
.note.bad{border-color:var(--margin);color:var(--margin)} .note.ok{border-color:var(--tick);color:var(--tick)}
.msg{background:var(--tick-bg);border-radius:14px 14px 14px 2px;padding:.8rem 1rem;max-width:22rem}
.filebtn{position:relative;overflow:hidden;display:inline-flex;align-items:center}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}

/* dashboard */
.dash{max-width:1180px;margin:0 auto;padding:1.25rem 1.25rem 4rem}
.tabs{display:flex;gap:.25rem;flex-wrap:wrap;border-bottom:1.5px solid var(--rule);margin-bottom:1.5rem}
.tabs button{border:0;background:transparent;padding:.7rem 1rem;min-height:44px;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1.5px;color:var(--ink2)}
.tabs button[aria-selected="true"]{border-color:var(--ink);color:var(--ink);font-weight:700}
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));border-top:2px solid var(--ink);border-bottom:1px solid var(--rule)}
.strip div{padding:.8rem 1rem .9rem 0}
.strip b{display:block;font-family:var(--display);font-size:1.9rem;line-height:1.1}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:.5rem .6rem;border-bottom:1px solid var(--rule);vertical-align:middle}
th{font-weight:700;color:var(--ink2);font-size:.875rem}
.reg{background:var(--sheet);border:1.5px solid var(--rule);min-width:720px}
.reg th,.reg td{border-bottom:1px solid var(--rule);border-right:1px solid var(--rule2);text-align:center;padding:0}
.reg th{padding:.45rem .3rem}
.reg .cls{text-align:left;padding:.4rem .7rem;white-space:nowrap;border-right:2px solid var(--margin)}
.reg .sch td{text-align:left;padding:.55rem .7rem;background:var(--paper);font-family:var(--display);font-weight:700}
.reg .sch span{font-family:var(--body);font-weight:400;color:var(--ink2);font-size:.875rem;margin-left:.5rem}
.cell{width:100%;min-width:44px;height:44px;border:0;background:transparent;cursor:pointer;font-size:1.25rem;font-weight:700;line-height:1}
.cell.ok{color:var(--tick)} .cell.wait{color:var(--wait)} .cell.rev{color:var(--margin);background:var(--margin-bg)} .cell.bad{color:var(--ink2)}
.cell.none{cursor:default}
.legend{display:flex;flex-wrap:wrap;gap:.4rem 1.25rem;margin-top:.6rem}
.qcard{background:var(--sheet);border:1.5px solid var(--rule);border-left:5px solid var(--margin);border-radius:0;padding:1rem}
.flag{color:var(--margin);font-weight:700}
.thumbs{display:flex;flex-wrap:wrap;gap:.75rem}
.thumbs figure{margin:0} .thumbs figcaption{font-size:.8125rem;color:var(--ink2);max-width:132px}
.crit{display:grid;grid-template-columns:auto 1fr auto;gap:.3rem .75rem;align-items:center;padding:.4rem 0;border-bottom:1px solid var(--rule2)}
.crit input{width:22px;height:22px}
.meter{height:10px;background:var(--rule2);border-radius:5px;overflow:hidden;min-width:120px}
.meter i{display:block;height:100%;background:var(--tick)}
dialog{border:2px solid var(--ink);border-radius:14px;background:var(--sheet);color:var(--ink);padding:0;width:min(640px,calc(100% - 2rem));max-height:calc(100% - 2rem)}
dialog::backdrop{background:rgba(10,20,40,.55)}
dl{display:grid;grid-template-columns:auto 1fr;gap:.3rem 1rem;margin:0}
dt{color:var(--ink2)} dd{margin:0}
details summary{cursor:pointer;font-weight:700;min-height:44px;display:flex;align-items:center}
@media (max-width:560px){.dash{padding:1rem .75rem 3rem}.strip b{font-size:1.5rem}}
</style>
</head>
<body>
<div class="bar">
  <div class="brand">Arogya SchoolTrack <span>prototype</span> <a href="../" style="font-family:var(--body);font-size:.9rem;font-weight:400;margin-left:.75rem">Back to Program MIS</a></div>
  <div class="seg" role="group" aria-label="Choose a view">
    <button data-a="mode" data-v="field" aria-pressed="true">Field app</button>
    <button data-a="mode" data-v="dash" aria-pressed="false">Monitoring dashboard</button>
  </div>
</div>
<main id="app"></main>
<dialog id="dlg" aria-label="Session details"></dialog>

<script>
"use strict";
const GEOFENCE_M=150, MIN_MIN=30, DUP_BITS=4, REPLY_HRS=48, KEY="schooltrack.v1";
const $=s=>document.querySelector(s);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nf=n=>Number(n).toLocaleString("en-IN");
const fmtDay=t=>new Date(t).toLocaleDateString("en-IN",{day:"numeric",month:"short"});
const fmtTime=t=>new Date(t).toLocaleTimeString("en-IN",{hour:"2-digit",minute:"2-digit",hour12:false});
const fmtDist=m=>m<1000?Math.round(m)+" m":(m/1000).toFixed(1)+" km";
const uid=()=>"s"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const rng=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
function hav(a,b,c,d){const R=6371000,r=x=>x*Math.PI/180,x=Math.sin(r(c-a)/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(r(d-b)/2)**2;return 2*R*Math.asin(Math.sqrt(x))}

const blank=()=>({coords:[],schools:{},sessions:{},as:{}});
let S=blank();
try{const raw=localStorage.getItem(KEY);if(raw){const p=JSON.parse(raw);if(p&&p.schools&&p.sessions)S=Object.assign(blank(),p)}}catch(e){}
let saveWarn="";
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(S));saveWarn=""}
  catch(e){saveWarn="This browser could not save the data. It stays until you close this page."}
}
const ui={mode:"field",tab:"overview",coord:null,screen:"home",schoolId:null,draft:null,lastId:null,asOpen:null,demo:{loc:"at",len:45},msg:""};

/* ---------- photos and fingerprints ---------- */
function dhash(src){
  const c=document.createElement("canvas");c.width=9;c.height=8;
  const x=c.getContext("2d",{willReadFrequently:true});if(!x)return null;
  x.drawImage(src,0,0,9,8);const d=x.getImageData(0,0,9,8).data;let bits="";
  for(let y=0;y<8;y++)for(let i=0;i<8;i++){const a=(y*9+i)*4,b=a+4;
    bits+=(d[a]*.299+d[a+1]*.587+d[a+2]*.114)>(d[b]*.299+d[b+1]*.587+d[b+2]*.114)?"1":"0"}
  let h="";for(let i=0;i<64;i+=4)h+=parseInt(bits.slice(i,i+4),2).toString(16);return h;
}
function ham(a,b){let n=0;for(let i=0;i<16;i++){let v=parseInt(a[i],16)^parseInt(b[i],16);while(v){n+=v&1;v>>=1}}return n}
function randHash(r){let h="";for(let i=0;i<16;i++)h+=Math.floor(r()*16).toString(16);return h}
function samplePhoto(seed){
  const r=rng(seed),c=document.createElement("canvas");c.width=160;c.height=120;
  const x=c.getContext("2d");if(!x)return{thumb:null,hash:randHash(r)};
  const hue=Math.floor(r()*360);
  x.fillStyle="hsl("+hue+" 28% "+(62+r()*20)+"%)";x.fillRect(0,0,160,120);
  x.fillStyle="hsl("+((hue+40)%360)+" 18% "+(34+r()*16)+"%)";x.fillRect(0,68+r()*18,160,60);
  x.fillStyle="#1f3b2d";x.fillRect(r()*90,8+r()*10,40+r()*50,24+r()*10);
  for(let gy=0;gy<8;gy++)for(let gx=0;gx<9;gx++){x.fillStyle=(r()>.5?"rgba(255,255,255,":"rgba(0,0,0,")+(.08+r()*.2)+")";x.fillRect(gx*160/9,gy*15,160/9+1,16)}
  const n=14+Math.floor(r()*18);
  for(let i=0;i<n;i++){const px=8+r()*144,py=58+r()*54,s=4+(py-50)/9;
    x.fillStyle="hsl("+(20+r()*20)+" 40% "+(18+r()*22)+"%)";x.beginPath();x.arc(px,py,s,0,7);x.fill();
    x.fillStyle=["#f2f2ee","#c9d8f0","#f0d9a8"][Math.floor(r()*3)];x.fillRect(px-s,py+s,2*s,s*1.5)}
  return{thumb:c.toDataURL("image/jpeg",.6),hash:dhash(c)||randHash(r)};
}
function fileToPhoto(file){return new Promise((res,rej)=>{
  const fr=new FileReader();fr.onerror=()=>rej(new Error("read"));
  fr.onload=()=>{const im=new Image();im.onerror=()=>rej(new Error("image"));
    im.onload=()=>{const c=document.createElement("canvas"),w=200,h=Math.max(1,Math.round(im.height/im.width*w));c.width=w;c.height=h;
      const x=c.getContext("2d");if(!x)return rej(new Error("canvas"));x.drawImage(im,0,0,w,h);
      res({thumb:c.toDataURL("image/jpeg",.6),hash:dhash(c)})};
    im.src=fr.result};
  fr.readAsDataURL(file)})}
function findDup(hash,selfId){
  if(!hash)return null;let best=null;
  for(const s of Object.values(S.sessions)){if(s.id===selfId)continue;
    for(const p of s.photos){if(p.kind!=="class"||!p.hash)continue;const d=ham(hash,p.hash);
      if(d<=DUP_BITS&&(!best||d<best.dist))best={sid:s.id,dist:d}}}
  return best;
}

/* ---------- verification ---------- */
const STATUS={verified:{sym:"\u2713",label:"Verified",cls:"ok"},waiting:{sym:"\u2026",label:"Waiting for school",cls:"wait"},
  review:{sym:"?",label:"Under review",cls:"rev"},rejected:{sym:"\u2715",label:"Not counted",cls:"bad"}};
const coordName=id=>(S.coords.find(c=>c.id===id)||{}).name||"Unknown";
function evaluate(s){
  const sc=S.schools[s.schoolId],cl=sc.classes.find(c=>c.id===s.classId),f=[];
  if(s.newAnchor)f.push("First visit. The school's location was recorded on this check-in and needs approval.");
  else{
    if(s.distIn>GEOFENCE_M)f.push("Checked in "+fmtDist(s.distIn)+" from the school. The limit is "+GEOFENCE_M+" m.");
    if(s.distOut!=null&&s.distOut>GEOFENCE_M)f.push("Checked out "+fmtDist(s.distOut)+" from the school.");
  }
  const mins=Math.round((s.endTs-s.startTs)/60000);
  if(mins<MIN_MIN)f.push("Lasted "+mins+" minutes. The minimum is "+MIN_MIN+".");
  for(const p of s.photos)if(p.kind==="class"&&p.dup){const o=S.sessions[p.dup.sid];
    f.push(o?"Class photo matches one from "+S.schools[o.schoolId].name+", "+fmtDay(o.startTs)+", logged by "+coordName(o.coordId)+".":"Class photo matches an earlier photo.")}
  if(!s.photos.some(p=>p.kind==="class"))f.push("No class photo.");
  if(!s.photos.some(p=>p.kind==="register"))f.push("No attendance register photo.");
  const tot=s.boys+s.girls;
  if(cl&&tot>cl.enrol)f.push("Reported "+tot+" students. Class "+cl.id+" has "+cl.enrol+" enrolled.");
  if(s.teacher==="disputed")f.push("The school says this record is wrong.");
  if(s.teacher==="pending"&&Date.now()-s.endTs>REPLY_HRS*36e5)f.push("The school has not confirmed in "+REPLY_HRS+" hours.");
  s.flags=f;
  s.status=s.review==="accepted"?"verified":s.review==="rejected"?"rejected":f.length?"review":s.teacher==="pending"?"waiting":"verified";
  return s;
}
const sessions=()=>Object.values(S.sessions).sort((a,b)=>b.startTs-a.startTs);
function cellSession(schoolId,classId,act){
  let live=null,dead=null;
  for(const s of Object.values(S.sessions)){if(s.schoolId!==schoolId||s.classId!==classId||s.activity!==act)continue;
    if(s.status==="rejected"){if(!dead||s.startTs>dead.startTs)dead=s}else if(!live||s.startTs>live.startTs)live=s}
  return live||dead;
}
const activityTaken=(schoolId,classId,act)=>Object.values(S.sessions).some(s=>s.schoolId===schoolId&&s.classId===classId&&s.activity===act&&s.status!=="rejected");
function schoolProgress(sc){let done=0;for(const c of sc.classes)for(let a=1;a<=10;a++){const s=cellSession(sc.id,c.id,a);if(s&&s.status==="verified")done++}return{done,total:sc.classes.length*10}}

/* ---------- Arogya Schools scoring ---------- */
const CRIT=[
 ["E","shc",12,"School Health Committee formed with students, teachers and parents"],
 ["E","hsp",15,"HSP activities completed for every section, 1.5 points each","auto"],
 ["E","man1",1.5,"First HSP manual available in the library"],["E","man2",1.5,"Second HSP manual available in the library"],
 ["E","kb1",2.5,"KAP baseline survey, year 1"],["E","ke1",2.5,"KAP endline survey, year 1"],
 ["E","kb2",2.5,"KAP baseline survey, year 2"],["E","ke2",2.5,"KAP endline survey, year 2"],
 ["E","sport",10,"Annual sports event with 80% of grade 6 and 7 students"],
 ["E","sugar",5,"Sugar board displayed"],["E","oil",5,"Oil board displayed"],
 ["E","demo",5,"School demographic survey completed"],
 ["E","omb",5,"Objective measurements at baseline"],["E","ome",5,"Objective measurements at endline"],
 ["P","hp1",2,"Health promotion activity with 80% of students, year 1"],["P","hp2",2,"Health promotion activity with 80% of students, year 2"],
 ["P","fu",5,"Follow-up survey with grade 8"],
 ["P","aw1",2,"Awareness event for staff and community, year 1"],["P","aw2",2,"Awareness event for staff and community, year 2"],
 ["P","water",2,"Potable drinking water available"],["P","wash",2,"Clean washrooms, separate for teachers and students"],
 ["P","tre",1,"25% of staff enrolled in NCD Prevention training"],["P","tra",1,"Enrolled staff attended the training"],
 ["P","gov",1,"A government scheme implemented"],["P","story",5,"Written impact story"]
];
function hspDone(sc){let n=0;for(let a=1;a<=10;a++){if(sc.classes.length&&sc.classes.every(c=>{const s=cellSession(sc.id,c.id,a);return s&&s.status==="verified"}))n++}return n}
function asScore(sc){
  const t=S.as[sc.id]||{};let e=0,p=0;
  for(const[g,k,pts,,auto]of CRIT){const got=auto?hspDone(sc)*1.5:(t[k]?pts:0);if(g==="E")e+=got;else p+=got}
  return{e,p,total:e+p,eligible:e>=75&&p>=5};
}

/* ---------- sample data ---------- */
function loadSample(){
  S=blank();const now=Date.now(),day=864e5,r=rng(20261005);
  S.coords=[{id:"c1",name:"Lakshmi R"},{id:"c2",name:"Manjunath K"},{id:"c3",name:"Fathima S"}];
  const list=[
   ["29280100101","GHPS Hebbal","Bengaluru North",13.0358,77.5970,"c1",true,[["6A",42],["6B",39]],6],
   ["29280100102","GHPS Yelahanka Old Town","Bengaluru North",13.1005,77.5963,"c1",true,[["6A",46],["6B",44],["6C",41]],5],
   ["29280100103","GHPS Jakkur","Bengaluru North",13.0784,77.6068,"c2",false,[["6A",35],["6B",33]],3],
   ["29280100104","GHPS Thanisandra","Bengaluru East",13.0580,77.6330,"c2",true,[["6A",48],["6B",45]],4],
   ["29280100105","GHPS Kodigehalli","Bengaluru North",13.0606,77.5788,"c3",false,[["6A",38],["6B",36]],2],
   ["29280100106","GHPS Vidyaranyapura","Bengaluru North",13.0767,77.5574,"c3",false,[["6A",40],["6B",43]],4]];
  let seed=100;const byKey={};
  for(const[id,name,block,lat,lng,coordId,isAS,classes,k]of list){
    S.schools[id]={id,name,block,lat,lng,coordId,isAS,teacher:"Head teacher",phone:"Sample number",classes:classes.map(([cid,enrol])=>({id:cid,enrol}))};
    for(const[cid,enrol]of classes)for(let a=1;a<=k;a++){
      const start=now-(k-a+1)*7*day-Math.floor(r()*3)*day,st=new Date(start);st.setHours(10+Math.floor(r()*4),Math.floor(r()*50),0,0);
      const mins=35+Math.floor(r()*16),tot=Math.round(enrol*(.85+r()*.12)),boys=Math.round(tot*(.45+r()*.1));
      const s={id:"seed"+(seed++),schoolId:id,classId:cid,activity:a,coordId,startTs:st.getTime(),endTs:st.getTime()+mins*6e4,
        distIn:15+r()*80,distOut:15+r()*80,boys,girls:tot-boys,teacher:"confirmed",
        photos:[Object.assign({kind:"class"},samplePhoto(seed*7)),{kind:"register",thumb:null,hash:null}]};

function demoPos(sc,where){const lat=sc.lat??13.05,lng=sc.lng??77.6;return where==="away"?{lat:lat+.021,lng:lng+.016}:{lat:lat+.0003,lng:lng+.0002}}
function getPos(sc){
  if(ui.demo.loc!=="real")return Promise.resolve(demoPos(sc,ui.demo.loc));
  return new Promise(res=>{
    const fail=()=>{ui.msg="This device did not share its location, so the demo location was used.";res(demoPos(sc,"at"))};
    if(!navigator.geolocation)return fail();
    navigator.geolocation.getCurrentPosition(p=>res({lat:p.coords.latitude,lng:p.coords.longitude}),fail,{enableHighAccuracy:true,timeout:9000,maximumAge:0});
  });
}

  const sc=S.schools[s.schoolId],cl=sc.classes.find(c=>c.id===s.classId),mins=Math.round((s.endTs-s.startTs)/60000);
  return '<div class="stack"><div class="row" style="justify-content:space-between"><h2>Activity '+s.activity+", class "+esc(s.classId)+"</h2>"+pill(s.status)+"</div>"+
   "<dl><dt>School</dt><dd>"+esc(sc.name)+"</dd><dt>Coordinator</dt><dd>"+esc(coordName(s.coordId))+"</dd><dt>When</dt><dd>"+fmtDay(s.startTs)+", "+fmtTime(s.startTs)+" to "+fmtTime(s.endTs)+" ("+mins+" minutes)</dd>"+
   "<dt>Check-in</dt><dd>"+(s.newAnchor?"Recorded as the school's location":fmtDist(s.distIn)+" from the school")+"</dd><dt>Check-out</dt><dd>"+(s.distOut==null?"Not recorded":fmtDist(s.distOut)+" from the school")+"</dd>"+
   "<dt>Students</dt><dd>"+(s.boys+s.girls)+" present ("+s.boys+" boys, "+s.girls+" girls) of "+(cl?cl.enrol:"?")+" enrolled</dd>"+
   "<dt>School</dt><dd>"+(s.teacher==="confirmed"?"Confirmed by the teacher":s.teacher==="disputed"?"Disputed by the teacher":"No reply yet")+"</dd>"+
   (s.review?"<dt>Review</dt><dd>"+(s.review==="accepted"?"Counted by a reviewer":"Rejected by a reviewer")+"</dd>":"")+"</dl>"+
   (s.flags.length?"<ul style=\"margin:0;padding-left:1.2rem\">"+s.flags.map(f=>'<li class="flag">'+esc(f)+"</li>").join("")+"</ul>":"")+evidence(s)+
   (s.teacher==="pending"&&!s.review?'<div class="demo stack"><p class="small">Demo: answer for the teacher</p><div class="row"><button class="btn" data-a="lateteacher" data-v="confirmed" data-id="'+esc(s.id)+'">Teacher confirms</button><button class="btn" data-a="lateteacher" data-v="disputed" data-id="'+esc(s.id)+'">Teacher disputes</button></div></div>':"")+
   (s.status==="review"?reviewButtons(s):"")+'<button class="btn quiet" data-a="close">Close</button></div>';
}

/* ---------- actions ---------- */
function render(){
  document.querySelectorAll(".bar .seg button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.v===ui.mode));
  $("#app").innerHTML=ui.mode==="field"?fieldView():dashView();
}
function openDetail(id){const s=S.sessions[id];if(!s)return;const d=$("#dlg");d.innerHTML='<div style="padding:1.25rem">'+detailHtml(s)+'</div>';if(!d.open){if(d.showModal)d.showModal();else d.setAttribute("open","")}}
function closeDetail(){const d=$("#dlg");if(d.open){if(d.close)d.close();else d.removeAttribute("open")}}
function setPhoto(kind,p){const d=ui.draft;if(!d)return;d.photos=d.photos.filter(x=>x.kind!==kind);const o={kind,thumb:p.thumb,hash:p.hash};
  if(kind==="class"){const dup=p.dup||findDup(p.hash,null);if(dup)o.dup=dup}d.photos.push(o);render()}
const A={
  mode(d){ui.mode=d.v;ui.msg="";render()},
  tab(d){ui.tab=d.v;ui.msg="";render()},
  sample(){loadSample()},
  reset(){S=blank();ui.screen="home";ui.draft=null;save();render()},
  home(){ui.screen="home";ui.draft=null;ui.msg="";render()},
  open(d){ui.schoolId=d.id;ui.screen="school";render()},
  demo(d){ui.demo[d.k]=d.k==="len"?Number(d.v):d.v;render()},
  start(){ui.draft={schoolId:ui.schoolId,classId:null,activity:null,photos:[],boys:"",girls:"",step:1};ui.msg="";ui.screen="session";render()},
  cancel(){ui.draft=null;ui.screen="school";render()},
  async checkin(){const d=ui.draft,sc=S.schools[d.schoolId];ui.msg="";const p=await getPos(sc);if(ui.draft!==d)return;
    if(sc.lat==null){sc.lat=p.lat;sc.lng=p.lng;d.newAnchor=true;d.distIn=0;save()}else d.distIn=hav(sc.lat,sc.lng,p.lat,p.lng);
    d.startTs=Date.now();d.step=2;render()},
  pickclass(d){ui.draft.classId=d.v;ui.draft.activity=null;render()},
  pickact(d){ui.draft.activity=Number(d.v);render()},
  next(){ui.msg="";ui.draft.step++;render()},
  samplephoto(d){setPhoto(d.kind,samplePhoto(Math.floor(Math.random()*1e9)))},
  oldphoto(){const pool=[];for(const s of Object.values(S.sessions))for(const p of s.photos)if(p.kind==="class"&&p.hash)pool.push({p,sid:s.id});
    if(!pool.length)return;const pick=pool[Math.floor(Math.random()*pool.length)];setPhoto("class",{thumb:pick.p.thumb,hash:pick.p.hash,dup:{sid:pick.sid,dist:0}})},
  async checkout(){const d=ui.draft,sc=S.schools[d.schoolId];const p=await getPos(sc);if(ui.draft!==d)return;const now=Date.now();
    const s={id:uid(),schoolId:d.schoolId,classId:d.classId,activity:d.activity,coordId:ui.coord,
      startTs:ui.demo.loc==="real"?d.startTs:now-ui.demo.len*6e4,endTs:now,distIn:d.distIn,distOut:hav(sc.lat,sc.lng,p.lat,p.lng),newAnchor:!!d.newAnchor,
      boys:Math.max(0,parseInt(d.boys,10)||0),girls:Math.max(0,parseInt(d.girls,10)||0),teacher:"pending",photos:d.photos};
    S.sessions[s.id]=evaluate(s);d.id=s.id;d.step=6;save();render()},
  teacher(d){const s=S.sessions[ui.draft.id];s.teacher=d.v;evaluate(s);save();ui.lastId=s.id;ui.draft=null;ui.screen="result";render()},
  lateteacher(d){const s=S.sessions[d.id];s.teacher=d.v;evaluate(s);save();render();openDetail(s.id)},
  detail(d){openDetail(d.id)},
  close(){closeDetail()},
  review(d){const s=S.sessions[d.id];s.review=d.v;evaluate(s);save();closeDetail();render()},
  asopen(d){ui.asOpen=ui.asOpen===d.id?null:d.id;render()},
  addschool(){const name=$("#n-name").value.trim(),id=$("#n-udise").value.trim(),block=$("#n-block").value.trim(),coordId=$("#n-coord").value;
    const classes=$("#n-classes").value.split(",").map(x=>x.split(":")).filter(x=>x.length===2).map(([c,n])=>({id:c.trim().slice(0,6),enrol:parseInt(n,10)})).filter(c=>c.id&&c.enrol>0);
    ui.msg=!name?"Enter the school name.":!/^\d{11}$/.test(id)?"A UDISE code has 11 digits.":S.schools[id]?"A school with this UDISE code is already listed.":!classes.length?"Add at least one class with its enrolment, like 6A: 42.":"";
    if(!ui.msg){S.schools[id]={id,name,block,lat:null,lng:null,coordId,isAS:false,teacher:"",phone:"",classes};save()}
    render();if(ui.msg){const dt=document.querySelector("details");if(dt)dt.open=true}}
};
document.addEventListener("click",e=>{const t=e.target.closest("[data-a]");if(!t||t.disabled)return;const fn=A[t.dataset.a];if(fn)fn(t.dataset,t)});
document.addEventListener("input",e=>{const t=e.target;if(t.dataset.c==="count"&&ui.draft)ui.draft[t.dataset.k]=t.value.replace(/[^\d]/g,"").slice(0,3)});
document.addEventListener("change",async e=>{const t=e.target,c=t.dataset.c;
  if(c==="coord"){ui.coord=t.value;render()}
  if(c==="photo"&&t.files&&t.files[0]){const kind=t.dataset.kind;try{setPhoto(kind,await fileToPhoto(t.files[0]))}catch(err){ui.msg="That file could not be read as a photo. Try again.";render()}}
  if(c==="crit"){S.as[t.dataset.id]=S.as[t.dataset.id]||{};S.as[t.dataset.id][t.dataset.k]=t.checked?1:0;save();render()}
  if(c==="isas"){S.schools[t.dataset.id].isAS=t.checked;save();render()}
});
$("#dlg").addEventListener("click",e=>{if(e.target===e.currentTarget)closeDetail()});
Object.values(S.sessions).forEach(evaluate);
render();
</script>
</body>
</html>
